name: Build Android APK & Publish Release (DepEd S.M.I.L.E. Parent App)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'parent_mobile_app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: parent_mobile_app/package.json

      - name: Install Mobile App Dependencies
        working-directory: parent_mobile_app
        run: |
          npm install

      - name: Initialize & Sync Capacitor Android
        working-directory: parent_mobile_app
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: parent_mobile_app/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: parent_mobile_app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          find parent_mobile_app/android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output_apk/deped-smile-parent.apk \;
          ls -la output_apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deped-smile-parent-apk
          path: output_apk/deped-smile-parent.apk
          retention-days: 30

      - name: Publish Official GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: "DepEd S.M.I.L.E. Parent Mobile App v2.4.0 (Android APK)"
          body: |
            ### 📱 DepEd Project S.M.I.L.E. - Official Parent Mobile App (Android APK)
            
            Official Android APK release for **Don Montano Central Integrated School** parents and legal guardians.
            
            #### 🌟 Features:
            - 🔔 **Real-Time Attendance Alerts**: Instant push alerts on learner gate arrivals (`TIME-IN`) & departures (`TIME-OUT`).
            - ⚠️ **Emergency Safety Bulletins**: Official weather suspensions, typhoons, and DepEd advisory alerts.
            - 📅 **School Calendar & Activities**: Interactive timeline of upcoming examinations, card days, and sports fests (with 1-click **Add to Calendar**).
            - 🪪 **Digital Pick-Up Pass**: Verified security QR pass to show campus security guards.
            - 📝 **Digital Excuse Letters**: Instant absence/tardiness notifications sent directly to the class adviser.
            
            #### 📲 Installation Instructions:
            1. Tap `deped-smile-parent.apk` below to download.
            2. If prompted by Android, toggle **"Allow installation from this source"**.
            3. Open the app and log in with your child's 12-digit LRN!
          files: output_apk/deped-smile-parent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
