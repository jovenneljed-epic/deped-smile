version: '3.8'

services:
  smile-web:
    build: .
    container_name: project_smile_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./static/qrcodes:/app/static/qrcodes
    environment:
      - PORT=5000
      - THREADS=8
      - DATABASE_TYPE=SQLITE
