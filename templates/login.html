<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal Sign-In | Project S.M.I.L.E.</title>

  <!-- PWA & Mobile Meta -->
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple_touch_icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/images/pwa_icon_192.png">
  <meta name="theme-color" content="#0B192C">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deped: {
              blue: '#0038A8',
              red: '#CE1126',
              gold: '#FCD116',
              darkblue: '#0B192C'
            }
          },
          fontFamily: {
            heading: ['Outfit', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #070d18; }
    .font-heading { font-family: 'Outfit', sans-serif; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

  <!-- Background Glow FX -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full glass-panel rounded-2xl sm:rounded-3xl p-5 sm:p-8 shadow-2xl relative z-10 text-slate-100 space-y-6">

    <!-- DepEd Header Brand -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center gap-3">
        <img src="/static/images/project_smile_logo.png" alt="Project S.M.I.L.E. Logo" class="w-14 h-14 rounded-2xl object-contain drop-shadow-md border border-amber-400/30">
        <div class="text-left">
          <span class="font-heading font-black text-xl tracking-tight text-white block">DEPED S.M.I.L.E.</span>
          <p class="text-[11px] font-bold text-amber-300 tracking-tight leading-tight mt-0.5">
            Security Monitoring, Incident Logging, and E-notification
          </p>
        </div>
      </div>
    </div>

    <!-- Alert / Feedback Message -->
    {% if error %}
    <div class="p-3.5 rounded-2xl bg-rose-500/20 border border-rose-500/40 text-rose-200 text-xs flex items-center gap-2.5">
      <i class="fa-solid fa-circle-exclamation text-rose-400 text-sm shrink-0"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" action="/login" class="space-y-4">
      <input type="hidden" name="next" value="{{ next_url or '' }}">

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
          Username or Email Address
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm pointer-events-none">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" name="username" id="inputUsername" required placeholder="admin, principal, teacher, or guard"
                 class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400/50 focus:border-amber-400 transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
          Account Password
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm pointer-events-none">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" name="password" id="inputPassword" required placeholder="••••••••"
                 class="w-full pl-10 pr-10 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400/50 focus:border-amber-400 transition">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white text-xs">
            <i class="fa-solid fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" 
              class="w-full py-3.5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-black font-heading rounded-xl text-sm shadow-lg shadow-amber-400/20 transition transform active:scale-[0.98] flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In to S.M.I.L.E. Portal
      </button>
    </form>

    <!-- Quick Test Role Logins (Demo Switcher) -->
    <div class="pt-4 border-t border-slate-800 space-y-2.5">
      <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block text-center">
        Quick One-Tap Role Demo Logins:
      </span>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button onclick="fillLogin('admin', 'admin123')" type="button" 
                class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-amber-400/30 text-amber-300 flex items-center gap-2 transition text-left">
          <div class="w-7 h-7 rounded-lg bg-amber-400/20 flex items-center justify-center text-xs shrink-0">
            <i class="fa-solid fa-crown"></i>
          </div>
          <div>
            <span class="font-extrabold block text-[11px] leading-tight text-white">Super Admin</span>
            <span class="text-[9px] text-amber-400">Settings & Billing</span>
          </div>
        </button>

        <button onclick="fillLogin('principal', 'principal123')" type="button" 
                class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-blue-400/30 text-blue-300 flex items-center gap-2 transition text-left">
          <div class="w-7 h-7 rounded-lg bg-blue-400/20 flex items-center justify-center text-xs shrink-0">
            <i class="fa-solid fa-school"></i>
          </div>
          <div>
            <span class="font-extrabold block text-[11px] leading-tight text-white">Principal</span>
            <span class="text-[9px] text-blue-300">Academic Operations</span>
          </div>
        </button>

        <button onclick="fillLogin('teacher', 'teacher123')" type="button" 
                class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-emerald-400/30 text-emerald-300 flex items-center gap-2 transition text-left">
          <div class="w-7 h-7 rounded-lg bg-emerald-400/20 flex items-center justify-center text-xs shrink-0">
            <i class="fa-solid fa-chalkboard-user"></i>
          </div>
          <div>
            <span class="font-extrabold block text-[11px] leading-tight text-white">Class Adviser</span>
            <span class="text-[9px] text-emerald-300">Grade 1 Section</span>
          </div>
        </button>

        <button onclick="fillLogin('guard', 'guard123')" type="button" 
                class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-purple-400/30 text-purple-300 flex items-center gap-2 transition text-left">
          <div class="w-7 h-7 rounded-lg bg-purple-400/20 flex items-center justify-center text-xs shrink-0">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <div>
            <span class="font-extrabold block text-[11px] leading-tight text-white">Campus Guard</span>
            <span class="text-[9px] text-purple-300">Kiosk Scanner Only</span>
          </div>
        </button>
      </div>
    </div>

    <!-- Parent Mobile App Link -->
    <div class="pt-3 text-center border-t border-slate-800/60">
      <a href="/apk" class="text-xs text-slate-400 hover:text-amber-300 transition inline-flex items-center gap-1.5">
        <i class="fa-brands fa-android text-emerald-400"></i>
        <span>Are you a parent or guardian? <strong>Download Parent Mobile App (APK)</strong></span>
      </a>
    </div>

  </div>

  <script>
    function fillLogin(user, pass) {
      document.getElementById('inputUsername').value = user;
      document.getElementById('inputPassword').value = pass;
    }

    function togglePasswordVisibility() {
      const pass = document.getElementById('inputPassword');
      const icon = document.getElementById('eyeIcon');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        pass.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }
  </script>
</body>
</html>
